<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de clientes - CarpinSoft</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="top-bar">
        <div class="btn-menu" onclick="toggleMenu()">MENU</div>
        <div class="title">CARPINSOFT</div> 
    </div>

    <div id="overlay" class="overlay" onclick="toggleMenu()"></div>

    <div id="side-menu" class="side-menu">
        <a href="inicio.html">Inicio</a>
        <a href="materiales.html">Gestión de materiales</a>
        <a href="pedidos.html">Gestión de pedidos</a>
        <a href="clientes.html">Gestión de clientes</a>
        <a href="reportes.html">Reportes</a>
        <a href="configuracion.html">Configuración</a>
    </div>

    <h2>Gestión de clientes</h2>

    <button onclick="abrirModal()">Agregar nuevo cliente</button>

    <table border="1" width="100%">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Contacto</th>
                <th>Dirección</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody id="tabla-clientes">
            <!-- Aquí se agregarán las filas de clientes dinámicamente -->
        </tbody>
    </table>

    <!-- Modal para el  formulario -->
    <div id="modal-cliente" class="modal">
        <h3>Nuevo cliente</h3>

        <!-- Campo oculto para el ID -->
        <input type="hidden" id="idCliente">

        <input type="text" id="nombre" placeholder="Nombre">
        <input type="text" id="contactoCliente" placeholder="Contacto">
        <input type="text" id="direccionCliente" placeholder="Dirección">

        <button onclick="guardarCliente()">Guardar</button>
        <button onclick="cerrarModal()">Cancelar</button>
    </div>


    <!-- Modales para mensajes -->
    <div id="modal-error" class="modal">
        <h3>!Error¡</h3>
        <p id="mensaje-error"></p>
        <button onclick="cerrarModal()">Aceptar</button>
    </div>

    <div id="modal-exito" class="modal">
        <h3>!Aviso¡</h3>
        <p id="mensaje-exito"></p>
        <button onclick="cerrarModal()">Aceptar</button>
    </div>

    <script>

        //Menu lateral
        function toggleMenu() {
            const menu = document.getElementById("side-menu");
            const overlay = document.getElementById("overlay");

            if (menu.style.left === "0px") {
                menu.style.left = "-200px";
                overlay.style.display = "none";
            } else {
                menu.style.left = "0px";
                overlay.style.display = "block";
            }
        }

       // URL del controlador
        const API_URL = "http://localhost/carpinsoft-api/routes/ClienteController.php";

        // Variable glocal para alamcenar clientes cargados
        let clientesCargados = [];

        // Cargar lista de clientes al cargar la página
        document.addEventListener("DOMContentLoaded", listarClientes);

        // 1 Leer clientes GET
        function listarClientes() {
            fetch(API_URL)
                .then(response => response.json())
                .then(data => {
                    clientesCargados = data; // Guardar los clientes cargados
                    const tabla = document.getElementById("tabla-clientes");
                    tabla.innerHTML = ""; // Limpiar la tabla antes de llenarla

                    data.forEach(c => {
                        const fila = document.createElement("tr");
                        fila.innerHTML = `
                            <td>${c.id_cliente}</td>
                            <td>${c.nombre}</td>
                            <td>${c.contacto}</td>
                            <td>${c.direccion}</td>
                            <td>
                                <button onclick="cargarParaEditar(${c.id_cliente})">Editar</button>
                                <button onclick="eliminarCliente(${c.id_cliente})">Eliminar</button>
                            </td>
                        `;
                        tabla.appendChild(fila);
                    });
                })
                .catch(() => mostrarError("No se pudo conectar con el servidor para obtener los clientes."));
                
        }

        // 2 Crear/Actualizar cliente POST
        function guardarCliente() {
            const id = document.getElementById("idCliente").value;
            const nombre = document.getElementById("nombre").value.trim();
            const contacto = document.getElementById("contactoCliente").value.trim();
            const direccion = document.getElementById("direccionCliente").value.trim();

            // Validaciones de frontend
            if (nombre === "" || contacto === "" || direccion === "") {
                mostrarError("Debe llenar todos los datos");
                return;
            }

            const soloLetras = /^[a-zA-ZÁÉÍÓÚáéíóúÑñ\s]+$/;
            const soloNumeros = /^[0-9]+$/;

            if (!soloLetras.test(nombre)) {
                mostrarError("Nombre inválido");
                return;
            }

            if (!soloNumeros.test(contacto)) {
                mostrarError("Contacto inválido");
                return;
            }

            // Mapear JSON para enviar al backend
            const datos = {
                id_cliente: id ? id : null,
                nombre: nombre,
                contacto: contacto,
                direccion: direccion
            };

            fetch(API_URL, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(datos)
            })
            .then(response => response.json())
            .then(res => {
                if(res.success) {
                    cerrarModal();
                    mostrarExito(id ? "Cliente actualizado correctamente" : "Cliente agregado correctamente");
                    limpiarFormulario();
                    listarClientes();
                } else {
                    mostrarError("Error al guardar el cliente");
                }
            })
            .catch(() => mostrarError ("Error en la solicitud HTTP al guardar."));

        }

        // 3 Cargar datos en modal para editar
        function cargarParaEditar(id) {
            //Buscar el cliente en la lista de clientes cargados
            const cliente = clientesCargados.find(c => c.id_cliente == id);

        if (cliente) {
            // Asignamos valores a los inputs
            if (document.getElementById("idCliente")) document.getElementById("idCliente").value = cliente.id_cliente;
            if (document.getElementById("nombre")) document.getElementById("nombre").value = cliente.nombre;
            if (document.getElementById("contactoCliente")) document.getElementById("contactoCliente").value = cliente.contacto;
            if (document.getElementById("direccionCliente")) document.getElementById("direccionCliente").value = cliente.direccion;
            
            // Abrimos el modal
            document.getElementById("modal-cliente").style.display = "block";
            document.getElementById("overlay").style.display = "block";
            } else {
            mostrarError("No se encontraron los datos del cliente.");
            }
        }

        // 4 Eliminar cliente DELETE
        function eliminarCliente(id) {
            if (confirm("¿Desea eliminar este cliente?")) {
                fetch(`${API_URL}?id=${id}`, { method: "DELETE" })
                    .then(response => response.json())
                    .then(res => {
                        if (res.success) {
                            mostrarExito("Cliente eliminado correctamente");
                            listarClientes();
                        } else {
                            mostrarError(res.message);
                        }
                    })
                    .catch(() => mostrarError("Error en la solicitud HTTP al eliminar."));
            }
        }

        function limpiarFormulario() {
            document.getElementById("idCliente").value = "";
            document.getElementById("nombre").value = "";
            document.getElementById("contactoCliente").value = "";
            document.getElementById("direccionCliente").value = "";
        }

        function abrirModalNuevo() {
            limpiarFormulario();
            document.getElementById("modal-titulo").innerText = "Nuevo cliente";
            abrirModal();
        }

        function abrirModal() {
            document.getElementById("modal-cliente").style.display = "block";
            document.getElementById("overlay").style.display = "block";
        }

        function cerrarModal() {
            document.getElementById("modal-cliente").style.display = "none";
            document.getElementById("modal-error").style.display = "none";
            document.getElementById("modal-exito").style.display = "none";
            document.getElementById("overlay").style.display = "none";
        }

        function mostrarExito(mensaje) {
            document.getElementById("mensaje-exito").innerText = mensaje;
            document.getElementById("modal-exito").style.display = "block";
            document.getElementById("overlay").style.display = "block";
        }

        function mostrarError(mensaje) {
            document.getElementById("mensaje-error").innerText = mensaje;
            document.getElementById("modal-error").style.display = "block";
            document.getElementById("overlay").style.display = "block";
        }

    </script>

</body>
</html>
