<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inicio - CarpinSoft</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="top-bar">
        <div class="btn-menu" onclick="toggleMenu()">MENU</div>
        <div class="title">CARPINSOFT</div> 
    </div>

    <div id="overlay" class="overlay" onclick="toggleMenu()"></div>

    <div id="side-menu" class="side-menu">
        <a href="inicio.html">Inicio</a>
        <a href="materiales.html">Gestión de materiales</a>
        <a href="pedidos.html">Gestión de pedidos</a>
        <a href="clientes.html">Gestión de clientes</a>
        <a href="proveedores.html">Gestión de proveedores</a>
        <a href="reportes.html">Reportes</a>
        <a href="configuracion.html">Configuración</a>
    </div>

    <h2>Gestión de materiales</h2>

    <button onclick="abrirModal()">Agregar material</button>

    <table border="1" width="100%">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Cantidad</th> 
                <th>Proveedor</th> 
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody id="tabla-materiales">
            <!-- materiales se cargan desde el controlador-->
        </tbody>
    </table>

    <div id="modal-materiales" class="modal">
        <h3 id="modal-titulo">Nuevo material</h3>
        
        <!-- ID utilizado únicamente para actualizar --> 
        <input type="hidden" id="id_material"> 

        <label >Material:</label>
        <input type="text" id="nombre" placeholder="Nombre del material" required > 
        <label >Cantidad:</label>
        <input type="number" id="cantidad" placeholder="Cantidad" min="0" step="1" required > 
        <!--campo proveedor -->
        <label>Proveedor:</label>
        <select id="idProveedor">
            <option value = "">Cargando proveedores...</option>
        </select>

        <br><br>
        <button type="button" onclick="guardarMaterial()">Guardar</button>
        <button onclick="cerrarModal()">Cancelar</button>
    </div>

    <div id="modal-error" class="modal">
        <h3>!Error¡</h3>
        <p id="mensaje-error"></p>
        <button onclick="cerrarModal()">Aceptar</button>
    </div>

    <div id="modal-exito" class="modal">
        <h3>!Aviso¡</h3>
        <p id="mensaje-exito"></p>
        <button onclick="cerrarModal()">Aceptar</button>
    </div>

    <script>

        //Menu lateral
        function toggleMenu() {
            const menu = document.getElementById("side-menu");
            const overlay = document.getElementById("overlay");

            if (menu.style.left === "0px") {
                menu.style.left = "-200px";
                overlay.style.display = "none";
            } else {
                menu.style.left = "0px";
                overlay.style.display = "block";
            }
        }

        //URL del controlador
        const API_MATERIAL = "http://localhost/carpinsoft-api/routes/MaterialController.php";
        const API_PROVEEDOR = "http://localhost/carpinsoft-api/routes/ProveedorController.php";

        // Variable glocal para alamcenar materiales cargados
        let materialesCargados = [];

        // Cargar lista de materiales al cargar la página
        document.addEventListener("DOMContentLoaded", () => {
            listarMateriales();
            cargarSelectProveedores();
        });

       // 1 Cargar proveedores en select FK
        function cargarSelectProveedores() {
            return fetch(API_PROVEEDOR)
                .then(response => response.json())
                .then(proveedores => {
                    const select = document.getElementById("idProveedor");
                    if (select) {
                        select.innerHTML = '<option value="">Seleccione proveedor</option>';
                        proveedores.forEach(p => {
                            // Validar si la propiedad del controlador es id_proveedor o id
                            const idProv = p.id_proveedor || p.id;
                            select.innerHTML += `<option value="${idProv}">${p.nombre}</option>`;
                        });
                    }
        })
        .catch(() => mostrarError("Error al conectar la base de datos de proveedores"));
        }

        // 2 Obtener materiales GET
        function listarMateriales() {
            fetch(API_MATERIAL)
                .then(response => response.json())
                .then(data => {
                    materialesCargados = data;
                    const tabla = document.getElementById("tabla-materiales");
                    tabla.innerHTML = "";

                    data.forEach(m => {
                        const fila = document.createElement("tr");
                        fila.innerHTML = `
                            <td>${m.id_material}</td>
                            <td>${m.nombre}</td>
                            <td>${m.cantidad}</td>
                            <td>${m.nombre_proveedor || m.id_proveedor}</td>
                            <td>
                                <button onclick="editarMaterialPorId(${m.id_material})">Editar</button>
                                <button onclick="eliminarFila(${m.id_material})">Eliminar</button>
                            </td>
                        `;
                        tabla.appendChild(fila);
                    });
                })
                .catch(() => mostrarError("Error al conectar con el servidor"));
        }

        //3 Crear/Actualizar material POST
        function guardarMaterial() {
            const id = document.getElementById("id_material").value.trim();
            const nombre = document.getElementById("nombre").value.trim();
            const cantidad = document.getElementById("cantidad").value.trim();
            const selectProv = document.getElementById("idProveedor");
            
            // Captura segura del value del select
            const idProveedor = selectProv ? selectProv.value.trim() : "";

            if (!nombre || !cantidad || !idProveedor || idProveedor === "undefined" || idProveedor === "") {
                mostrarError("Debe seleccionar un proveedor válido.");
                return;
            }

            const datos = {
                id_material: id !== "" ? id : null,
                nombre: nombre,
                cantidad: cantidad,
                id_proveedor: idProveedor
            };

            fetch(API_MATERIAL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            })
            .then(response => response.json())
            .then(response => {
                if (response.success) {
                    cerrarModal();
                    mostrarExito(id ? "Material actualizado correctamente" : "Material registrado correctamente");
                    limpiarFormulario();
                    listarMateriales();
                } else {
                    mostrarError("No se pudo guardar el material en la base de datos.");
                }
            })
            .catch(() => mostrarError("Error al conectar la base de datos de materiales"));
        }

        // 4 Editar material
        async function editarMaterialPorId(id) {
            const material = materialesCargados.find(m => m.id_material == id);

            if (material) {
                // Si el select no tiene opciones cargadas, las carga antes de asignar el valor
                const select = document.getElementById("idProveedor");
                if (select && select.options.length <= 1) {
                    await cargarSelectProveedores();
                }

                const titulo = document.getElementById("modal-titulo");
                if (titulo) titulo.innerText = "Editar Material";

                document.getElementById("id_material").value = material.id_material;
                document.getElementById("nombre").value = material.nombre || "";
                document.getElementById("cantidad").value = material.cantidad || "";

                // Asignación de la FK
                if (select) {
                    select.value = material.id_proveedor || "";
                }

                abrirModal();
            } else {
                mostrarError("No se encontraron los datos del material.");
            }
        }

        // 5 Eliminar material DELETE
        function eliminarFila(id) {
            if (confirm("¿Desea eliminar este material?")) {
                fetch(`${API_MATERIAL}?id_material=${id}`, {
                    method: 'DELETE'
                })
                .then(response => response.json())
                .then(response => {
                    if (response.success) {
                        mostrarExito("Material eliminado correctamente");
                        listarMateriales();
                    } else {
                        mostrarError("No se pudo eliminar el material.");
                    }
                })
                .catch(() => mostrarError("Error al conectar la base de datos de materiales"));
            }
        }

        function limpiarFormulario() {
            document.getElementById("id_material").value = "";
            document.getElementById("nombre").value = "";
            document.getElementById("cantidad").value = "";
            document.getElementById("idProveedor").value = "";
        }
        

        function abrirModal() {
            document.getElementById("modal-materiales").style.display = "block";
            document.getElementById("overlay").style.display = "block";
        }

        function cerrarModal() {
            document.getElementById("modal-materiales").style.display = "none";
            document.getElementById("modal-error").style.display = "none";
            document.getElementById("modal-exito").style.display = "none";
            document.getElementById("overlay").style.display = "none";
        }

        function mostrarExito(mensaje) {
            document.getElementById("mensaje-exito").innerText = mensaje;
            document.getElementById("modal-exito").style.display = "block";
            document.getElementById("overlay").style.display = "block";
        }

        function mostrarError(mensaje) {
            document.getElementById("mensaje-error").innerText = mensaje;
            document.getElementById("modal-error").style.display = "block";
            document.getElementById("overlay").style.display = "block";
        }

    </script>

</body>
</html>
