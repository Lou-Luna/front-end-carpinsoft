<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inicio - CarpinSoft</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="top-bar">
        <div class="btn-menu" onclick="toggleMenu()">MENU</div>
        <div class="title">CARPINSOFT</div> 
    </div>

    <div id="overlay" class="overlay" onclick="toggleMenu()"></div>

    <div id="side-menu" class="side-menu">
        <a href="inicio.html">Inicio</a>
        <a href="materiales.html">Gestión de materiales</a>
        <a href="pedidos.html">Gestión de pedidos</a>
        <a href="clientes.html">Gestión de clientes</a>
        <a href="proveedores.html">Gestión de proveedores</a>
        <a href="reportes.html">Reportes</a>
        <a href="configuracion.html">Configuración</a>
    </div>

    <h2>Gestión de proveedores</h2>

    <button onclick="abrirModal()">Agregar proveedor</button>

    <table border="1" width="100%">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Contacto</th> 
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody id="tabla-proveedores">
            <!-- proveedores se cargan desde el controlador-->
        </tbody>
    </table>

    <div id="modal-proveedores" class="modal">
        <h3 id="modal-titulo">Nuevo proveedor</h3>
        
        <!-- ID utilizado únicamente para actualizar --> 
        <input type="hidden" id="idProveedor"> 

        <label >Proveedor:</label>
        <input type="text" id="nombreProveedor" placeholder="Nombre del proveedor" required > 
        <label >Contacto:</label>
        <input type="text" id="contactoProveedor" placeholder="Teléfono de contacto" required > 

        <br><br>
        <button type="button" onclick="guardarProveedor()">Guardar</button>
        <button onclick="cerrarModal()">Cancelar</button>
    </div>

    <div id="modal-error" class="modal">
        <h3>!Error¡</h3>
        <p id="mensaje-error"></p>
        <button onclick="cerrarModal()">Aceptar</button>
    </div>

    <div id="modal-exito" class="modal">
        <h3>!Aviso¡</h3>
        <p id="mensaje-exito"></p>
        <button onclick="cerrarModal()">Aceptar</button>
    </div>

    <script>

        //Menu lateral
        function toggleMenu() {
            const menu = document.getElementById("side-menu");
            const overlay = document.getElementById("overlay");

            if (menu.style.left === "0px") {
                menu.style.left = "-200px";
                overlay.style.display = "none";
            } else {
                menu.style.left = "0px";
                overlay.style.display = "block";
            }
        }

        // URL del controlador
        const API_URL = "http://localhost/carpinsoft-api/routes/ProveedorController.php";

        // Variable glocal para alamcenar proveedores cargados
        let proveedoresCargados = [];

        // Cargar lista de proveedores al cargar la página
        document.addEventListener("DOMContentLoaded", listarProveedores);

        // 1 Leer proveedores GET
        function listarProveedores() {
            fetch(API_URL)
                .then(response => response.json())
                .then(data => {
                    proveedoresCargados = data; // Guardar los proveedores cargados
                    const tabla = document.getElementById("tabla-proveedores");
                    tabla.innerHTML = ""; // Limpiar la tabla antes de llenarla

                    data.forEach(c => {
                        const fila = document.createElement("tr");
                        fila.innerHTML = `
                            <td>${c.id}</td>
                            <td>${c.nombre}</td>
                            <td>${c.contacto}</td>
                            <td>
                                <button onclick="cargarParaEditar(${c.id})">Editar</button>
                                <button onclick="eliminarProveedor(${c.id})">Eliminar</button>
                            </td>
                        `;
                        tabla.appendChild(fila);
                    });
                })
                .catch(() => mostrarError("No se pudo conectar con el servidor para obtener los proveedores."));
                
        }

        // 2 Crear/Actualizar proveedor POST
        function guardarProveedor() {
            const id = document.getElementById("idProveedor").value;
            const nombre = document.getElementById("nombreProveedor").value.trim();
            const contacto = document.getElementById("contactoProveedor").value.trim();

            // Validaciones de frontend
            if (nombre === "" || contacto === "") {
                mostrarError("Debe llenar todos los datos");
                return;
            }

            const soloNumeros = /^[0-9]+$/;

            if (!soloNumeros.test(contacto)) {
                mostrarError("Contacto inválido");
                return;
            }

            // Mapear JSON para enviar al backend
            const datos = {
                id_proveedor: id ? id : null,
                nombre: nombre,
                contacto: contacto
            };

            fetch(API_URL, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(datos)
            })
            .then(response => response.json())
            .then(res => {
                if(res.success) {
                    cerrarModal();
                    mostrarExito(id ? "Proveedor actualizado correctamente" : "Proveedor agregado correctamente");
                    limpiarFormulario();
                    listarProveedores();
                } else {
                    mostrarError("Error al guardar el proveedor");
                }
            })
            .catch(() => mostrarError ("Error en la solicitud HTTP al guardar."));

        }

        // 3 Cargar datos en modal para editar
        function cargarParaEditar(id) {
            //Buscar el proveedor en la lista de proveedores cargados
            const proveedor = proveedoresCargados.find(p => p.id == id);

        if (proveedor) {
            // Asignamos valores a los inputs
            if (document.getElementById("idProveedor")) document.getElementById("idProveedor").value = proveedor.id;
            if (document.getElementById("nombreProveedor")) document.getElementById("nombreProveedor").value = proveedor.nombre;
            if (document.getElementById("contactoProveedor")) document.getElementById("contactoProveedor").value = proveedor.contacto;
            
            // Abrimos el modal
            document.getElementById("modal-proveedores").style.display = "block";
            document.getElementById("overlay").style.display = "block";
            } else {
            mostrarError("No se encontraron los datos del proveedor.");
            }
        }

        // 4 Eliminar proveedor DELETE
        function eliminarProveedor(id) {
            if (confirm("¿Desea eliminar este proveedor?")) {
                fetch(`${API_URL}?id=${id}`, { method: "DELETE" })
                    .then(response => response.json())
                    .then(res => {
                        if (res.success) {
                            mostrarExito("Proveedor eliminado correctamente");
                            listarProveedores();
                        } else {
                            mostrarError(res.message);
                        }
                    })
                    .catch(() => mostrarError("Error en la solicitud HTTP al eliminar."));
            }
        }

        function limpiarFormulario() {
            document.getElementById("nombreProveedor").value = "";
            document.getElementById("contactoProveedor").value = "";
        }
        

        function abrirModal() {
            limpiarFormulario();

            document.getElementById("modal-titulo").innerText = "Nuevo proveedor";
            document.getElementById("modal-proveedores").style.display = "block";
            document.getElementById("overlay").style.display = "block";
        }

        function cerrarModal() {
            document.getElementById("modal-proveedores").style.display = "none";
            document.getElementById("modal-error").style.display = "none";
            document.getElementById("modal-exito").style.display = "none";
            document.getElementById("overlay").style.display = "none";
        }

        function mostrarExito(mensaje) {
            document.getElementById("mensaje-exito").innerText = mensaje;
            document.getElementById("modal-exito").style.display = "block";
            document.getElementById("overlay").style.display = "block";
        }

        function mostrarError(mensaje) {
            document.getElementById("mensaje-error").innerText = mensaje;
            document.getElementById("modal-error").style.display = "block";
            document.getElementById("overlay").style.display = "block";
        }

    </script>

</body>
</html>
